[project]
name = "sessions"
version = "0.1.0"
description = "List recent Claude, OpenCode, and agy sessions by repo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sessions = "sessions.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sessions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
